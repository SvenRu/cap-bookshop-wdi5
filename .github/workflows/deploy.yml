name: Build and Transport to cTMS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ──────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies & build MTA ────────────────────────
      - name: Install dependencies
        run: npm ci

      - name: Install MTA Build Tool
        run: npm install -g mbt

      - name: Build .mtar
        run: mbt build
        # Produces: ./mta_archives/capire.bookshop_1.0.0.mtar

      # ── 4. Fetch OAuth token from cTMS UAA ─────────────────────────
      - name: Get OAuth token
        id: token
        run: |
          RESPONSE=$(curl --silent \
            --request POST \
            --url "${{ secrets.CTMS_UAA_URL }}/oauth/token" \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=${{ secrets.CTMS_CLIENT_ID }}" \
            --data-urlencode "client_secret=${{ secrets.CTMS_CLIENT_SECRET }}")
          echo "UAA response: $RESPONSE"
          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "ERROR: Failed to obtain access token"
            exit 1
          fi
          echo "access_token=$TOKEN" >> "$GITHUB_OUTPUT"

      # ── 5. Upload .mtar to cTMS ────────────────────────────────────
      - name: Upload archive to cTMS
        id: upload
        run: |
          RESPONSE=$(curl --silent --fail \
            --request POST \
            --url "${{ secrets.CTMS_API_URL }}/v2/files/upload" \
            --header "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            --form "file=@mta_archives/capire.bookshop_1.0.0.mtar")
          FILE_ID=$(echo "$RESPONSE" | jq -r '.fileId')
          echo "file_id=$FILE_ID" >> "$GITHUB_OUTPUT"

      # ── 6. Create Transport Request targeting the DEV node ─────────
      - name: Create Transport Request
        id: transport
        run: |
          RESPONSE=$(curl --silent --fail \
            --request POST \
            --url "${{ secrets.CTMS_API_URL }}/v2/nodes/upload" \
            --header "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            --header "Content-Type: application/json" \
            --data '{
              "nodeName": "GitHubActions-Dev",
              "contentType": "MTA",
              "storageType": "FILE",
              "entries": [
                {
                  "uri": "${{ steps.upload.outputs.file_id }}"
                }
              ],
              "description": "Automated transport from GitHub Actions — ${{ github.sha }}"
            }')
          TR_ID=$(echo "$RESPONSE" | jq -r '.transportRequestId')
          echo "transport_request_id=$TR_ID" >> "$GITHUB_OUTPUT"
          echo "Transport Request created: $TR_ID"

      # ── 7. Job summary ─────────────────────────────────────────────
      - name: Print summary
        run: |
          echo "## cTMS Transport Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| File ID | \`${{ steps.upload.outputs.file_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Transport Request | \`${{ steps.transport.outputs.transport_request_id }}\` |" >> $GITHUB_STEP_SUMMARY
