name: Build and Transport to cTMS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ──────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies & build MTA ────────────────────────
      - name: Install dependencies
        run: npm ci

      - name: Install MTA Build Tool
        run: npm install -g mbt

      - name: Build .mtar
        run: mbt build
        # Produces: ./mta_archives/capire.bookshop_1.0.0.mtar

      # ── 4. Parse service key & fetch OAuth token ───────────────────
      - name: Get OAuth token
        id: token
        env:
          TMS_SERVICE_KEY: ${{ secrets.TMS_SERVICE_KEY }}
        run: |
          SERVICE_KEY_FILE=$(mktemp)
          echo "$TMS_SERVICE_KEY" > "$SERVICE_KEY_FILE"

          UAA_URL=$(jq -r '.uaa.url' "$SERVICE_KEY_FILE")
          CLIENT_ID=$(jq -r '.uaa.clientid' "$SERVICE_KEY_FILE")
          CLIENT_SECRET=$(jq -r '.uaa.clientsecret' "$SERVICE_KEY_FILE")

          ACCESS_TOKEN=$(curl --fail --silent \
            --request POST "${UAA_URL}/oauth/token" \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "client_secret=${CLIENT_SECRET}" \
            | jq -r '.access_token')

          rm -f "$SERVICE_KEY_FILE"
          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      # ── 5. Upload .mtar to cTMS ────────────────────────────────────
      - name: Upload archive to cTMS
        id: upload
        env:
          TMS_SERVICE_KEY: ${{ secrets.TMS_SERVICE_KEY }}
        run: |
          TMS_URI=$(echo "$TMS_SERVICE_KEY" | jq -r '.uri')
          RESPONSE=$(curl --fail --silent \
            --request POST \
            --url "${TMS_URI}/v2/files/upload" \
            --header "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            --form "file=@mta_archives/capire.bookshop_1.0.0.mtar")
          FILE_ID=$(echo "$RESPONSE" | jq -r '.fileId')
          echo "file_id=$FILE_ID" >> "$GITHUB_OUTPUT"

      # ── 6. Create Transport Request targeting GitHubActions-Dev ───
      - name: Create Transport Request
        id: transport
        env:
          TMS_SERVICE_KEY: ${{ secrets.TMS_SERVICE_KEY }}
        run: |
          TMS_URI=$(echo "$TMS_SERVICE_KEY" | jq -r '.uri')
          COMMIT_MSG=$(git log -1 --format='%s' | tr -cd 'a-zA-Z0-9 \-._~:/?#@!$&()*+,;=%')
          RESPONSE=$(curl --silent \
            --request POST \
            --url "${TMS_URI}/v2/nodes/upload" \
            --header "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            --header "Content-Type: application/json" \
            --data "{
              \"nodeName\": \"GitHubActions-Dev\",
              \"contentType\": \"MTA\",
              \"storageType\": \"FILE\",
              \"namedUser\": \"${{ github.actor }}\",
              \"entries\": [{ \"uri\": \"${{ steps.upload.outputs.file_id }}\" }],
              \"description\": \"${{ github.sha }} ${COMMIT_MSG}\"
            }")
          echo "Transport response: $RESPONSE"
          TR_ID=$(echo "$RESPONSE" | jq -r '.transportRequestId')
          if [ "$TR_ID" = "null" ] || [ -z "$TR_ID" ]; then
            echo "ERROR: Failed to create transport request"
            exit 1
          fi
          echo "transport_request_id=$TR_ID" >> "$GITHUB_OUTPUT"
          echo "Transport Request created: $TR_ID"

      # ── 7. Job summary ─────────────────────────────────────────────
      - name: Print summary
        run: |
          echo "## cTMS Transport Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| File ID | \`${{ steps.upload.outputs.file_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Transport Request | \`${{ steps.transport.outputs.transport_request_id }}\` |" >> $GITHUB_STEP_SUMMARY
